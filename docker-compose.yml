services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: 2567
    ports:
      - "2567:2567"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
